<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理后台{% endblock %} · 求索论坛</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container-admin nav-inner">
            <a href="{{ url_for('index') }}" class="logo">
                <span>SEEKING</span>
            </a>
            <div class="admin-nav-links">
                <a href="{{ url_for('admin_dashboard') }}" class="nav-link {% if request.endpoint=='admin_dashboard' %}nav-link-accent{% endif %}">概览</a>
                <a href="{{ url_for('admin_users') }}" class="nav-link {% if request.endpoint=='admin_users' %}nav-link-accent{% endif %}">用户</a>
                <a href="{{ url_for('admin_posts') }}" class="nav-link {% if request.endpoint=='admin_posts' %}nav-link-accent{% endif %}">帖子</a>
                <a href="{{ url_for('admin_comments') }}" class="nav-link {% if request.endpoint=='admin_comments' %}nav-link-accent{% endif %}">评论</a>
            </div>
            <div class="nav-actions">
                <a href="{{ url_for('index') }}" class="nav-link">← 回到前台</a>
                <div class="user-menu">
                    <a href="{{ url_for('user_profile', username=current_user.username) }}" class="username">{{ current_user.username }}<span class="badge-tms">TMS</span></a>
                </div>
            </div>
        </div>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="container-admin">
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">
                        <span>{{ message }}</span>
                        <button class="flash-close" onclick="this.parentElement.remove()">×</button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main class="container-admin main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container-admin">
            求索论坛管理后台 · 自动化系TMS协会
        </div>
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
